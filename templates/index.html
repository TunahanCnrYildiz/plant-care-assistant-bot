<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitki Bakım Asistanı / Plant Care Assistant</title>
    <!-- Google Fonts Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0e1a12 0%, #080d0a 100%);
            --forest-green: #2e6f40;
            --mint-green: #4ade80;
            --glass-bg: rgba(25, 40, 30, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --user-bubble: linear-gradient(135deg, #1b4d2c 0%, #14351f 100%);
            --bot-bubble: rgba(255, 255, 255, 0.03);
            --accent-glow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* App Container */
        .app-container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            background: rgba(15, 25, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), var(--accent-glow);
            overflow: hidden;
        }

        /* Sidebar Settings */
        .sidebar {
            width: 320px;
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.25);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            font-size: 2rem;
            color: var(--mint-green);
            animation: float 3s ease-in-out infinite;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, var(--mint-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-group {
            margin-bottom: 25px;
        }

        .settings-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            border-color: var(--mint-green);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        .exit-btn {
            width: 100%;
            padding: 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            color: #ef4444;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .exit-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            transform: translateY(-2px);
        }

        /* Chat Window */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.05);
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--mint-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--mint-green);
        }

        .messages-container {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Custom Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }

        /* Message Bubbles */
        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message-sender {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message.user .message-sender {
            text-align: right;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            border: 1px solid rgba(74, 222, 128, 0.1);
            border-bottom-right-radius: 4px;
            color: #ffffff;
        }

        .message.bot .message-bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.03);
        }

        .did-you-mean {
            font-size: 0.85rem;
            color: var(--mint-green);
            background: rgba(74, 222, 128, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(74, 222, 128, 0.15);
            display: inline-block;
        }

        /* System Info Banner */
        .system-info {
            align-self: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 90%;
            margin: 10px 0;
        }

        /* Input Panel */
        .input-panel {
            padding: 20px 30px 30px 30px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--mint-green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .send-btn {
            padding: 16px 28px;
            background: linear-gradient(135deg, #2e6f40 0%, #1b4d2c 100%);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            border-color: var(--mint-green);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.25);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        /* Product Recommendation Badges */
        .product-recommendations {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.15);
            border-radius: 12px;
            color: var(--mint-green);
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.3s;
        }

        .product-badge:hover {
            background: rgba(74, 222, 128, 0.1);
            transform: translateX(4px);
        }

        .product-icon {
            font-size: 1.15rem;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 12px 18px;
            background: var(--bot-bubble);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            align-self: flex-start;
            margin-top: 10px;
            animation: fadeIn 0.3s forwards;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <span class="brand-icon">🌿</span>
                    <h1 class="brand-title">Botanik Asistanı</h1>
                </div>

                <!-- Mode Select -->
                <div class="settings-group">
                    <label class="settings-label" id="label-mode">Aktif Mod / Mode</label>
                    <select id="mode-select">
                        <option value="hootl">HOOTL (Local AI + DB)</option>
                        <option value="hitl">HITL (Expert Panel Only)</option>
                        <option value="hotl" selected>HOTL (Hybrid Mode)</option>
                    </select>
                </div>

                <!-- Language Select -->
                <div class="settings-group">
                    <label class="settings-label" id="label-lang">Varsayılan Dil / Language</label>
                    <select id="lang-select">
                        <option value="tr" selected>Türkçe (TR)</option>
                        <option value="en">English (EN)</option>
                    </select>
                </div>
            </div>

            <!-- Exit Button -->
            <button class="exit-btn" id="btn-exit" onclick="window.close();">Kapat / Exit</button>
        </aside>

        <!-- Chat Window -->
        <main class="chat-window">
            <header class="chat-header">
                <h2 style="font-size: 1.1rem; font-weight: 600;" id="header-title">Bitki Sağlığı Danışma Paneli</h2>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="status-text">Lokal Sistem Hazır</span>
                </div>
            </header>

            <!-- Message Area -->
            <div class="messages-container" id="messages-container">
                <!-- Welcome Message -->
                <div class="system-info" id="welcome-banner">
                    <strong>Bitki Bakımı Asistanına Hoş Geldiniz!</strong><br>
                    UYARI: Bu bot kesin ziraat veya tıbbi tavsiye vermez. Ciddi durumlarda bir uzmana başvurun.
                </div>
            </div>

            <!-- Input Panel -->
            <div class="input-panel">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Bitkiniz hakkında bir soru yazın..." autocomplete="off">
                </div>
                <button class="send-btn" id="send-button" onclick="sendMessage()">
                    <span>Gönder</span>
                    <span style="font-size: 1.1rem;">⚡</span>
                </button>
            </div>
        </main>
    </div>

    <script>
        const chatInput = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('messages-container');
        const modeSelect = document.getElementById('mode-select');
        const langSelect = document.getElementById('lang-select');
        const statusText = document.getElementById('status-text');
        
        // Generate a unique session ID for conversation state and expert chat persistence
        const sessionId = 'session_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
        let chatHistory = [];

        // Simple localization mapping for static UI elements based on selected language
        const uiStrings = {
            tr: {
                welcome: "<strong>Bitki Bakımı Asistanına Hoş Geldiniz!</strong><br>UYARI: Bu bot kesin ziraat veya tıbbi tavsiye vermez. Ciddi durumlarda bir uzmana başvurun.",
                placeholder: "Bitkiniz hakkında bir soru yazın...",
                send: "Gönder",
                headerTitle: "Bitki Sağlığı Danışma Paneli",
                statusReady: "Lokal Sistem Hazır",
                statusWaiting: "Yanıt Bekleniyor...",
                exitBtn: "Kapat / Exit",
                userPrefix: "Sen",
                thinking: "Düşünüyor...",
                expert_conn: "İMDAT! Uzmana bağlanılıyor. Lütfen bekleyin..."
            },
            en: {
                welcome: "<strong>Welcome to the Plant Care Assistant!</strong><br>WARNING: This bot does not provide definitive agricultural or medical advice. Consult an expert for serious cases.",
                placeholder: "Type a question about your plant...",
                send: "Send",
                headerTitle: "Plant Health Consultation Panel",
                statusReady: "Local System Ready",
                statusWaiting: "Awaiting Response...",
                exitBtn: "Exit / Close",
                userPrefix: "You",
                thinking: "Thinking...",
                expert_conn: "SOS! Connecting to expert. Please wait..."
            }
        };

        langSelect.addEventListener('change', () => {
            const l = langSelect.value;
            document.getElementById('welcome-banner').innerHTML = uiStrings[l].welcome;
            chatInput.placeholder = uiStrings[l].placeholder;
            document.querySelector('#send-button span').textContent = uiStrings[l].send;
            document.getElementById('header-title').textContent = uiStrings[l].headerTitle;
            statusText.textContent = uiStrings[l].statusReady;
            document.getElementById('btn-exit').textContent = uiStrings[l].exitBtn;
        });

        // Trigger send on Enter key
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            const currentLang = langSelect.value;
            const currentMode = modeSelect.value;

            // 1. Add User Message to UI
            appendMessage(uiStrings[currentLang].userPrefix, text, 'user');

            // 2. Add temporary Thinking indicator
            statusText.textContent = uiStrings[currentLang].statusWaiting;
            const typingIndicator = showTypingIndicator();

            try {
                // Send post request to Flask API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: text,
                        mode: currentMode,
                        lang: currentLang,
                        history: chatHistory
                    })
                });

                // Clear typing indicator once stream starts
                removeTypingIndicator(typingIndicator);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let currentBotMessage = null;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // keep last partial line

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6).trim();
                            if (dataStr === '[DONE]') {
                                break;
                            }
                            try {
                                const data = JSON.parse(dataStr);
                                currentBotMessage = handleMessageChunk(data, currentBotMessage);
                            } catch (e) {
                                console.error('Error parsing streaming JSON:', e);
                            }
                        }
                    }
                }

                // Add to local chat history for conversation memory sliding window
                if (currentBotMessage) {
                    const finalBotText = currentBotMessage.querySelector('.message-bubble').innerText;
                    chatHistory.push({
                        user: text,
                        assistant: finalBotText
                    });
                    if (chatHistory.length > 4) {
                        chatHistory.shift();
                    }
                }

            } catch (err) {
                console.error('Error connecting to API backend:', err);
                removeTypingIndicator(typingIndicator);
                appendMessage('System', 'Server error. Please ensure Flask app is running.', 'bot');
            } finally {
                statusText.textContent = uiStrings[currentLang].statusReady;
            }
        }

        function appendMessage(sender, content, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            const senderSpan = document.createElement('span');
            senderSpan.className = 'message-sender';
            senderSpan.innerText = sender;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = content;

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bubbleDiv);
            messagesContainer.appendChild(msgDiv);
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msgDiv;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return indicator;
        }

        function removeTypingIndicator(indicator) {
            if (indicator && indicator.parentNode) {
                indicator.parentNode.removeChild(indicator);
            }
        }

        function handleMessageChunk(data, currentBotMessage) {
            const currentLang = langSelect.value;
            
            if (data.type === 'status') {
                // System notification/thinking state
                appendMessage(data.prefix, data.content, 'bot');
            } 
            else if (data.type === 'unrelated') {
                // Out of scope query warning
                appendMessage('Bot', data.content, 'bot');
            } 
            else if (data.type === 'expert_response') {
                // Expert response
                appendMessage(data.prefix, data.content, 'bot');
            } 
            else if (data.type === 'db') {
                // DB classification match
                const sender = data.prefix || 'Bot: ';
                const container = document.createElement('div');
                
                // Add did-you-mean banner if present
                if (data.did_you_mean) {
                    container.innerHTML += `<div class="did-you-mean">${data.did_you_mean}</div><br>`;
                }
                
                container.innerHTML += `<span>${data.content}</span>`;
                
                // Add product recommendations with icons if present
                if (data.recommendation) {
                    const badgeContainer = document.createElement('div');
                    badgeContainer.className = 'product-recommendations';
                    
                    let icon = '🛒';
                    if (data.recommendation.includes('gubre')) icon = '🧪';
                    else if (data.recommendation.includes('saksi')) icon = '🏺';
                    else if (data.recommendation.includes('toprak')) icon = '🪨';
                    
                    badgeContainer.innerHTML = `
                        <a href="#" class="product-badge">
                            <span class="product-icon">${icon}</span>
                            <span>${data.recommendation}</span>
                        </a>
                    `;
                    container.appendChild(badgeContainer);
                }
                
                return appendMessage(sender, container.innerHTML, 'bot');
            } 
            else if (data.type === 'ai_start') {
                // LLM generation started
                currentBotMessage = appendMessage(data.prefix, '', 'bot');
            } 
            else if (data.type === 'token') {
                // Stream token append
                if (currentBotMessage) {
                    const bubble = currentBotMessage.querySelector('.message-bubble');
                    // Format newline tokens into HTML breaks
                    const tokenFormatted = data.content.replace(/\n/g, '<br>');
                    bubble.innerHTML += tokenFormatted;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } 
            else if (data.type === 'error') {
                appendMessage('System', data.content, 'bot');
            }

            return currentBotMessage;
        }
    </script>
</body>
</html>
